[project]
name = "sidekick"
version = "0.1.0"
description = "Your personal AI software engineering assistant"
requires-python = ">=3.11"
dependencies = ["python-telegram-bot>=21.6,<22", "python-dotenv>=1.0", "pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
